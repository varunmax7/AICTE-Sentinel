[project]
name = "acp-api"
version = "0.1.0"
description = "AICTE Approval & Compliance Portal — core API (apps/api)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery[redis]>=5.6.3",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "twilio>=9.12.0",
    "sse-starlette>=3.5.0",
    "argon2-cffi>=25.1.0",
    "simpleeval>=1.0",
    "boto3>=1.35",
    "pdf2image>=1.17",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "reportlab>=4.2",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` / `Cookie(...)` as a parameter default is the
# documented, idiomatic pattern throughout this codebase — not the "mutable
# default argument" footgun this rule exists to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "twilio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "simpleeval.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pytesseract.*", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's `@task` decorator is untyped (no py.typed marker), which strict mode
# otherwise flags on every task function across every phase that adds one.
module = "app.workers.tasks.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, matching the module-level async engine
# (an asyncpg connection is bound to the loop it was created on — a per-test
# loop would make the pooled engine unusable after the first test).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
